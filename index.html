<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<!--
  =============================================================
  หน้าครอบ (Wrapper) — ระบบบริการรถยนต์ส่วนกลาง
  วางไฟล์นี้เป็น index.html บนโดเมนของคุณ
  แก้แค่ 2 ค่าในส่วน "ตั้งค่า" ด้านล่าง (APP_URL และ BANNER)
  =============================================================
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0878E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ระบบบริการรถยนต์ส่วนกลาง</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;              /* ไม่มี scrollbar ของหน้าครอบ */
    background: #0878E8;
    overscroll-behavior: none;
  }

  /* กรอบ: เต็มจอจริงบนมือถือ (100dvh ไม่โดน address bar บัง) */
  #frameBox {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;                 /* สำรองสำหรับเบราว์เซอร์เก่า */
    height: 100dvh;
    overflow: hidden;
    background: #F4FAFF;
  }

  /* iframe ไม่มีขอบ ไม่มี scrollbar ของตัวเอง (หน้าแอปเลื่อนเองข้างใน) */
  #app {
    position: absolute;
    left: 0;
    top: calc(-1 * var(--banner, 0px));               /* ดันขึ้นเพื่อซ่อนแถบ Google */
    width: 100%;
    height: calc(100% + var(--banner, 0px));
    border: 0;
    margin: 0;
    padding: 0;
    display: block;
    background: #F4FAFF;
  }

  /* ---------- Loading screen ---------- */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    background: radial-gradient(120% 80% at 50% 0%, #2EA8FF 0%, #1597F5 40%, #0878E8 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Thai', sans-serif;
    transition: opacity .6s ease, visibility .6s ease;
  }

  #loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  #loader img {
    width: min(260px, 70vw);
    height: auto;
    animation: breathe 2.2s ease-in-out infinite;
  }

  .ld-bar {
    width: min(200px, 55vw);
    height: 4px;
    border-radius: 99px;
    background: rgba(255,255,255,.25);
    overflow: hidden;
  }

  .ld-bar span {
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 99px;
    background: #fff;
    animation: slide 1.2s ease-in-out infinite;
  }

  .ld-text { font-size: 15px; opacity: .9; letter-spacing: .2px; }

  .ld-retry {
    display: none;
    margin-top: -8px;
    padding: 10px 22px;
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 99px;
    background: rgba(255,255,255,.15);
    color: #fff;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }

  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .7; } }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }

  @media (prefers-reduced-motion: reduce) {
    #loader img, .ld-bar span { animation: none; }
  }
</style>
</head>

<body>

<div id="frameBox">
  <iframe
    id="app"
    title="ระบบบริการรถยนต์ส่วนกลาง"
    allow="geolocation; clipboard-write; fullscreen"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
</div>

  <div class="ld-bar"><span></span></div>
  <div class="ld-text" id="ldText">กำลังเปิดระบบบริการรถยนต์ส่วนกลาง...</div>
  <button type="button" class="ld-retry" id="ldRetry" onclick="location.reload()">ลองใหม่อีกครั้ง</button>
</div>

<script>
  /* =============================================================
     ตั้งค่า (แก้แค่ตรงนี้)
     ============================================================= */

  // 1) ลิงก์ Web app ของคุณ (Deploy > Manage deployments > คัดลอก URL ที่ลงท้ายด้วย /exec)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzyomc6z54EhJ5loDQsF3GpP8qR80n7LaKxUc5kYI5-J75yoqEZzn9IDeRiNVhxZWAv/exec';

  // 2) ความสูงของแถบ "แอปพลิเคชันนี้สร้างโดยผู้ใช้ Google Apps Script" (หน่วย px)
  //    เริ่มที่ 0 ก่อน ถ้าเปิดแล้วยังเห็นแถบ ให้ทดลองค่าโดยเติมท้ายลิงก์ เช่น
  //    https://โดเมนของคุณ/?banner=48  แล้วค่อยมาใส่ค่าที่พอดีตรงนี้
  var BANNER_DESKTOP = 0;
  var BANNER_MOBILE  = 0;

  /* ============================================================= */

  (function () {

    var frame  = document.getElementById('app');
    var loader = document.getElementById('loader');
    var done   = false;

    // ความสูงแถบ: ค่าจากลิงก์ ?banner= (ใช้ทดลอง) > ค่าที่ตั้งไว้
    var params = new URLSearchParams(location.search);
    var isMobile = window.matchMedia('(max-width: 767px)').matches;
    var banner = params.has('banner') ? Number(params.get('banner')) : (isMobile ? BANNER_MOBILE : BANNER_DESKTOP);
    if (!isFinite(banner) || banner < 0) banner = 0;
    document.documentElement.style.setProperty('--banner', banner + 'px');

    function hideLoader() {
      if (done) return;
      done = true;
      loader.classList.add('hide');
      setTimeout(function () { loader.style.display = 'none'; }, 700);
    }

    // ทางที่ดีที่สุด: แอปส่งสัญญาณ "app-ready" มาเมื่อโหลดข้อมูลเสร็จ
    window.addEventListener('message', function (e) {
      if (!/\.(google|googleusercontent)\.com$/.test(new URL(e.origin).hostname)) return;
      if (e.data === 'app-ready') hideLoader();
    });

    // สำรอง: iframe โหลดเสร็จ (หน้าแอปยังวาดต่ออีกนิด จึงรอเพิ่ม 1.2 วินาที)
    frame.addEventListener('load', function () {
      setTimeout(hideLoader, 1200);
    });

    // ถ้าช้าเกิน 12 วินาที บอกผู้ใช้ และเปิดให้เห็นแอปเลย
    setTimeout(function () {
      if (done) return;
      document.getElementById('ldText').textContent = 'อินเทอร์เน็ตช้า กำลังพยายามโหลด...';
      document.getElementById('ldRetry').style.display = 'block';
    }, 12000);

    setTimeout(hideLoader, 25000);

    // เริ่มโหลดแอป (ส่งพารามิเตอร์ต่อท้ายลิงก์ไปให้แอปด้วย ยกเว้น banner)
    params.delete('banner');
    var qs = params.toString();
    frame.src = APP_URL + (qs ? (APP_URL.indexOf('?') === -1 ? '?' : '&') + qs : '');

  })();
</script>
